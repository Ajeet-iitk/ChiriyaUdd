<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chiriya Udd — Kingdom of the Birds">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#241a3f"/>
      <stop offset="0.55" stop-color="#161028"/>
      <stop offset="1" stop-color="#0d0a17"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd08a" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ff9e5e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6ea"/>
      <stop offset="0.55" stop-color="#ffd6a8"/>
      <stop offset="1" stop-color="#ffab6b"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#night)"/>
  <circle cx="45" cy="21" r="17" fill="url(#dawn)"/>
  <circle cx="45" cy="21" r="5.4" fill="#ffc46b"/>
  <circle cx="45" cy="21" r="8.4" fill="none" stroke="#ffc46b" stroke-opacity="0.35" stroke-width="1"/>

  <!-- a small bird flying home, far off -->
  <path d="M9 27c2.6-1.6 5-1.7 7.5-0.4M19 24c2-1.2 3.8-1.2 5.6-0.2"
    fill="none" stroke="#ffe7c6" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round"/>

  <!-- the bird -->
  <g transform="translate(-6 3)">
    <path d="M15 40c-3.6 0.6-6.5 2.6-8.5 5.6 4.6-0.8 8.4-0.2 11.4 1.6z" fill="#c98a5e"/>
    <path d="M22 45c2.4-11 8.4-17.6 17-19.4 7.8-1.6 14 1.6 16.8 8.4 1.4 3.4 0.6 6.6-2.6 8.6-6.0 3.8-15.6 4.6-23 2.6-4.6-1.2-7.4-3.4-8.2-6.2z"
      fill="url(#wing)"/>
    <path d="M26 44c5-6 12-9.6 20-9.2 4.6 0.2 8.4 2 11.4 5-5.6-2.4-11.4-2.8-17.4-1-5 1.6-9.4 3.4-14 5.2z"
      fill="#ffbe86" opacity="0.85"/>
    <path d="M49 30c3.4-3.4 5-7.6 4.6-12.4-0.2-3.6 1.4-6.2 4.4-6.6 3.2-0.4 5.4 2 5.2 5.4-0.2 3.4-3 5.4-3.4 9.2"
      fill="none" stroke="url(#wing)" stroke-width="7.4" stroke-linecap="round"/>
    <circle cx="59" cy="17.4" r="5.4" fill="#ffd6a8"/>
    <path d="M63.6 17.6 70 20l-6.6 2.2z" fill="#f2a64a"/>
    <circle cx="60.4" cy="16.2" r="1.2" fill="#2a1120"/>
    <path d="M56 12c1.5-3 3.5-4.6 6-5-1 2.6-2.6 4.4-5 5.4z" fill="url(#wing)"/>
  </g>

  <path d="M12 55.5h40" stroke="#ffc46b" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M20 52.5v6M32 52v7M44 52.5v6" stroke="#ffc46b" stroke-opacity="0.22" stroke-width="1" stroke-linecap="round"/>
</svg>
